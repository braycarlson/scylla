[workspace]

[package]
name = "runner"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
proc-macro2 = { version = "1", features = ["span-locations"] }
ruff_python_parser = { git = "https://github.com/astral-sh/ruff", tag = "0.16.3" }
scylla = { path = "../.." }
syn = { version = "2", features = ["full", "visit", "extra-traits"] }
tree-sitter = "0.25"
tree-sitter-css = "0.23"
tree-sitter-javascript = "0.23"
tree-sitter-odin = "1.3.0"
tree-sitter-typescript = "0.23"

[profile.release]
opt-level = 2
