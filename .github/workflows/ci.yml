name: ci

on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt

      - uses: Swatinem/rust-cache@v2

      - run: cargo +nightly fmt --check

      - run: cargo clippy --all-targets -- --deny warnings

      - run: cargo clippy --all-targets --features fuzzing -- --deny warnings

      - if: matrix.os == 'ubuntu-latest'
        run: cargo +nightly fmt --check --manifest-path tools/runner/Cargo.toml

      - if: matrix.os == 'ubuntu-latest'
        run: cargo clippy --all-targets --manifest-path tools/runner/Cargo.toml -- --deny warnings

      - run: cargo test

      - run: cargo test --release

      - if: matrix.os == 'ubuntu-latest'
        run: cargo test --release --manifest-path tools/runner/Cargo.toml

  corpus:
    if: vars.CORPUS_REPOSITORY != ''
    runs-on: ubuntu-latest
    env:
      SCYLLA_CORPUS: ${{ github.workspace }}/corpus/sources
      SCYLLA_CORPUS_GOLDEN: ${{ github.workspace }}/corpus/goldens/treesitter
      SCYLLA_CORPUS_GOTYPES: ${{ github.workspace }}/corpus/goldens/gotypes
      SCYLLA_CORPUS_OXLINT: ${{ github.workspace }}/corpus/goldens/oxlint
      SCYLLA_CORPUS_RUFF: ${{ github.workspace }}/corpus/goldens/ruff
      SCYLLA_CORPUS_REQUIRED: 1
    steps:
      - uses: actions/checkout@v7

      - uses: actions/checkout@v7
        with:
          repository: ${{ vars.CORPUS_REPOSITORY }}
          ref: ${{ vars.CORPUS_REF }}
          path: corpus

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - run: cargo test --release
