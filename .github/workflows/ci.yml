name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      # The repository sets imports_layout = HorizontalVertical, which stable
      # rustfmt warns about and then ignores, re-packing every import list the
      # ruleset requires spread. The format gate is nightly for that reason;
      # never run stable `cargo fmt` here or locally.
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt

      - uses: Swatinem/rust-cache@v2

      - run: cargo +nightly fmt --check

      - run: cargo clippy --all-targets -- --deny warnings

      - run: cargo clippy --all-targets --features fuzzing -- --deny warnings

      - run: cargo test

      - run: cargo test --release
